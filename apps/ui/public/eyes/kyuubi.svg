<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Kyuubi (Nine-Tails Fox) - Orange/red eye with vertical slit pupil -->

  <!-- Outer eye (bright orange/red gradient effect) -->
  <defs>
    <radialGradient id="kyuubiGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Main eye circle with gradient -->
  <circle cx="32" cy="32" r="28" fill="url(#kyuubiGradient)" stroke="#000000" stroke-width="1.5"/>

  <!-- Vertical slit pupil (like a fox/cat) -->
  <ellipse cx="32" cy="32" rx="3" ry="20" fill="#000000"/>

  <!-- Inner pupil highlight for depth -->
  <ellipse cx="32" cy="26" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.4"/>

  <!-- Subtle outer glow effect -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FF6600" stroke-width="0.5" opacity="0.3"/>
</svg>
